<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página não encontrada | NotaFlow</title>
    <meta name="description" content="Esta página não existe no NotaFlow." />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('malphas-theme');
          if (t) document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/site/site.ts"></script>
  </head>
  <body class="min-h-screen bg-surface font-sans text-fg antialiased">
    <header class="mx-auto flex max-w-3xl items-center justify-between gap-4 px-5 py-5">
      <a href="/" aria-label="NotaFlow, página inicial" class="inline-flex items-center gap-2 font-display text-xl font-semibold text-fg">
        <svg viewBox="0 0 128 100" class="h-7 w-auto" aria-hidden="true">
          <defs>
            <mask id="nf-gap-404">
              <rect width="128" height="100" fill="white" />
              <path d="M8,50 H102 V38 L120,56 L102,74 V62 H8 Z" fill="black" stroke="black" stroke-width="6" />
            </mask>
          </defs>
          <g class="fill-fg" mask="url(#nf-gap-404)">
            <rect x="8" y="12" width="16" height="76" />
            <polygon points="8,12 25,12 76,88 59,88" />
          </g>
          <g class="fill-brand">
            <rect x="60" y="12" width="16" height="76" />
            <rect x="60" y="12" width="56" height="16" />
            <path d="M8,50 H102 V38 L120,56 L102,74 V62 H8 Z" />
          </g>
        </svg>
        NotaFlow
      </a>
      <button
        type="button"
        data-theme-toggle
        title="Alternar entre tema claro e escuro"
        aria-label="Alternar entre tema claro e escuro"
        class="rounded border border-border px-2 py-1 text-sm text-muted hover:text-fg focus:outline-none focus:ring-2 focus:ring-primary/50"
      >
        <span class="dark:hidden" aria-hidden="true">☾</span>
        <span class="hidden dark:inline" aria-hidden="true">☀</span>
      </button>
    </header>

    <main class="mx-auto max-w-3xl px-5 pb-24 pt-16">
      <p class="text-sm text-muted">Erro 404</p>
      <h1 class="mt-2 font-display text-3xl font-semibold tracking-tight sm:text-4xl">Página não encontrada</h1>
      <p class="mt-4 max-w-xl leading-relaxed text-muted">
        O endereço pode estar errado, ou a página mudou de lugar. Para emitir suas notas, entre na
        sua conta.
      </p>
      <div class="mt-8 flex flex-wrap items-center gap-3">
        <a
          href="/"
          class="inline-flex h-11 items-center rounded bg-primary px-5 font-medium text-primary-fg hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-primary/50"
          >Ir para a página inicial</a
        >
        <a
          href="/entrar"
          class="inline-flex h-11 items-center rounded border border-border px-5 font-medium text-fg hover:bg-muted/10 focus:outline-none focus:ring-2 focus:ring-primary/50"
          >Entrar</a
        >
      </div>
    </main>

    <footer class="border-t border-border">
      <div
        class="mx-auto flex max-w-3xl flex-col gap-4 px-5 py-8 text-sm text-muted sm:flex-row sm:items-center sm:justify-between"
      >
        <p>NotaFlow, um produto Vapulab.</p>
        <nav class="flex flex-wrap gap-x-6 gap-y-2" aria-label="Rodapé">
          <a class="hover:text-fg" href="/">Início</a>
          <a class="hover:text-fg" href="/termos">Termos de uso</a>
          <a class="hover:text-fg" href="/privacidade">Política de privacidade</a>
          <a class="hover:text-fg" href="mailto:contato@vapulab.com">Contato</a>
        </nav>
      </div>
    </footer>
  </body>
</html>
