# Monitoring stack on the Vapulab VPS, in /opt/monitoring. See docs/TUTORIALS/MONITORING.md.
#
# Only Grafana joins northub_default, so the tunnel reaches it as grafana.vapulab.com. Everything else
# stays on the "monitoring" network, which the NotaFlow app also joins so Prometheus can scrape it.
# No service publishes a host port.
name: monitoring

services:
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus:/prometheus
    networks: [monitoring]

  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
      # The webhook URL, written by hand on the VPS; never in git.
      - ./secrets/alert_webhook_url:/run/secrets/alert_webhook_url:ro
      - alertmanager:/alertmanager
    networks: [monitoring]

  loki:
    image: grafana/loki:3.5.3
    restart: unless-stopped
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./loki:/etc/loki:ro
      - loki:/loki
    networks: [monitoring]

  alloy:
    image: grafana/alloy:v1.10.0
    restart: unless-stopped
    command: run --storage.path=/var/lib/alloy /etc/alloy/config.alloy
    volumes:
      - ./alloy:/etc/alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy:/var/lib/alloy
    networks: [monitoring]

  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.textfile.directory=/textfile
    pid: host
    volumes:
      - /:/host:ro,rslave
      # The off-site backup writes its last success here (deploy/offsite-backup.sh).
      - /var/lib/node_exporter/textfile:/textfile:ro
    networks: [monitoring]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    restart: unless-stopped
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [monitoring]

  blackbox:
    image: prom/blackbox-exporter:v0.27.0
    restart: unless-stopped
    command: --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./blackbox:/etc/blackbox:ro
    networks: [monitoring]

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    env_file: .env
    environment:
      GF_SERVER_ROOT_URL: https://grafana.vapulab.com
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_NEWS_NEWS_FEED_ENABLED: 'false'
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    networks:
      monitoring:
      northub:
        aliases: [grafana]

volumes:
  prometheus:
  alertmanager:
  loki:
  alloy:
  grafana:

networks:
  monitoring:
    name: monitoring
  northub:
    name: northub_default
    external: true
