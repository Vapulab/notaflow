global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: notaflow
    static_configs:
      - targets: [notaflow:9464]

  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]

  - job_name: cadvisor
    static_configs:
      - targets: [cadvisor:8080]
    # Only the per-container series the panels and alerts use; cAdvisor exposes thousands.
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: container_(cpu_usage_seconds_total|memory_working_set_bytes|start_time_seconds|network_(receive|transmit)_bytes_total|last_seen)
        action: keep

  - job_name: monitoring
    static_configs:
      - targets: [prometheus:9090, alertmanager:9093, loki:3100, alloy:12345, grafana:3000, blackbox:9115]

  - job_name: probe
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://notaflow.vapulab.com/api/health
          - https://notaflow.vapulab.com/
          - https://vapulab.com/
          - https://northub.tech/
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
