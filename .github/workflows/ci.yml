name: CI
on:
  pull_request:
  push:
    branches: [production]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - run: pip install -r tools/xsd/requirements.txt -e "services/signer-py[test]"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pytest services/signer-py
      - uses: gitleaks/gitleaks-action@v3
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
  monitoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prometheus config and alert rules
        run: |
          docker run --rm -v "$PWD/deploy/monitoring/prometheus:/etc/prometheus:ro" -w /etc/prometheus \
            --entrypoint promtool prom/prometheus:v3.5.0 check config prometheus.yml
          docker run --rm -v "$PWD/deploy/monitoring/prometheus:/etc/prometheus:ro" -w /etc/prometheus \
            --entrypoint promtool prom/prometheus:v3.5.0 test rules rules.test.yml
      - name: Alertmanager config
        run: |
          docker run --rm -v "$PWD/deploy/monitoring/alertmanager:/etc/alertmanager:ro" \
            --entrypoint amtool prom/alertmanager:v0.28.1 check-config /etc/alertmanager/alertmanager.yml
          # The Watchdog goes only to Healthchecks.io; every other alert goes to the channel.
          for case in "Watchdog healthchecks" "SiteDown channel"; do
            set -- $case
            got=$(docker run --rm -v "$PWD/deploy/monitoring/alertmanager:/etc/alertmanager:ro" \
              --entrypoint amtool prom/alertmanager:v0.28.1 config routes test \
              --config.file=/etc/alertmanager/alertmanager.yml alertname=$1)
            test "$got" = "$2" || { echo "$1 routes to $got, not $2"; exit 1; }
          done
      - name: Loki, Alloy, and blackbox config
        run: |
          docker run --rm -v "$PWD/deploy/monitoring/loki:/etc/loki:ro" grafana/loki:3.5.3 \
            -config.file=/etc/loki/loki.yml -verify-config
          docker run --rm -v "$PWD/deploy/monitoring/alloy:/etc/alloy:ro" grafana/alloy:v1.10.0 \
            fmt /etc/alloy/config.alloy > /dev/null
          docker run --rm -v "$PWD/deploy/monitoring/blackbox:/etc/blackbox:ro" prom/blackbox-exporter:v0.27.0 \
            --config.file=/etc/blackbox/blackbox.yml --config.check
      - name: Dashboards are valid JSON
        run: for f in deploy/monitoring/grafana/dashboards/*.json; do jq empty "$f"; done
      - name: Every Prometheus query of the dashboards parses
        run: |
          python3 deploy/monitoring/dashboard-queries.py > deploy/monitoring/prometheus/dashboard-queries.yml
          docker run --rm -v "$PWD/deploy/monitoring/prometheus:/etc/prometheus:ro" -w /etc/prometheus \
            --entrypoint promtool prom/prometheus:v3.5.0 check rules --lint=none dashboard-queries.yml
