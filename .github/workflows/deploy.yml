name: Deploy

# After CI passes on production: build the image, push it to GHCR, and run it on the Vapulab VPS.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [production]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    # A manual run deploys only production; an automatic one only a push that passed CI.
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/production') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # The owner is "Vapulab", but an image name must be lowercase.
      - id: image
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:${{ steps.sha.outputs.sha }}
            ${{ steps.image.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://notaflow.vapulab.com
    permissions:
      contents: read
      packages: read
    env:
      TAG: ${{ needs.build.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.sha }}

      # Runs wait in one queue, but CI of two quick merges can finish out of order. Only the commit
      # that is the tip of production goes live; an older one is skipped, and the newer run deploys.
      - name: Check this is the newest commit on production
        id: newest
        run: |
          tip=$(git ls-remote origin refs/heads/production | cut -f1)
          if [ "$tip" = "$TAG" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipped: production is at ${tip}, newer than ${TAG}; its own run deploys it."
          fi

      # The VM_* secrets live in the production environment, which only the production branch can use.
      - name: Configure SSH
        if: steps.newest.outputs.deploy == 'true'
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VM_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host vm
            HostName $VM_HOST
            User notaflow-deploy
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
          EOF

      # The key runs only notaflow-deploy (deploy/notaflow-deploy.sh): it takes this commit's compose
      # file and image from GitHub, after it checks that the commit is on production.
      - name: Start the new version
        if: steps.newest.outputs.deploy == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | ssh vm notaflow-deploy up "$TAG"

      - name: Health check
        if: steps.newest.outputs.deploy == 'true'
        run: ssh vm notaflow-deploy health
